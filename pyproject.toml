[project]
name = "live-translate"
version = "0.1.0"
description = "Local live speech translation (Albanian/German -> English) on Apple Silicon"
requires-python = ">=3.13"
dependencies = [
    "ctranslate2>=4.8.2",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.4",
    "mlx-lm>=0.31.3",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "rich>=15.0.0",
    "sacrebleu>=2.6.0",
    "sentencepiece>=0.2.2",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
live-translate = "live_translate.app:main"
live-translate-ui = "live_translate.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_translate"]
